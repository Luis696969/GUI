<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSim Pro - Interfaz de Simulación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <header class="text-center mb-5 header-hero">
            <h1 class="display-4 fw-bold mb-2">
                BioSim <span class="text-info">Interface</span>
            </h1>
            <p class="text-muted mb-0">
                Configuración de parámetros para simulación de difusión celular.
            </p>
        </header>

        <!-- SIMULACIÓN -->
        <div class="row g-4">
            <div class="col-12">
                <div class="card p-4 shadow-sm h-100">
                    <h5 class="mb-3">Simulación</h5>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label>T (Segundos)</label>
                            <input type="number" id="sim_T" class="form-control" value="7200">
                        </div>
                        <div class="col-md-6">
                            <label>dt</label>
                            <input type="number" id="sim_dt" class="form-control" value="0.01" step="0.001">
                        </div>
                        <div class="col-12 text-muted small mt-3">
                            Los tiempos de ploteo se calculan automáticamente.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DISPOSITIVOS -->
        <div class="mt-5">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">
                <h3 class="d-flex align-items-center gap-2 mb-0">
                    <span>Dispositivos</span>
                    <span id="count-devices" class="count-badge">0</span>
                </h3>
                <button class="btn btn-primary" onclick="addItem('devices')">
                    + Añadir Dispositivo
                </button>
            </div>
            <div id="container-devices" class="dynamic-container"></div>
        </div>

        <!-- CONEXIONES -->
        <div class="mt-5">
            <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-3">
                <h3 class="d-flex align-items-center gap-2 mb-0">
                    <span>Conexiones entre dispositivos</span>
                    <span id="count-links" class="count-badge">0</span>
                </h3>
                <button class="btn btn-primary" onclick="addItem('links')">
                    + Añadir Conexión
                </button>
            </div>
            <div id="container-links" class="dynamic-container"></div>
        </div>

        <!-- BOTÓN PRINCIPAL -->
        <div class="d-grid mt-5">
            <button class="btn btn-success btn-lg shadow" onclick="ejecutarSimulacion()">
                🚀 Generar JSON e Iniciar Simulación
            </button>
        </div>

        <!-- PREVIEW JSON -->
        <div class="mt-5">
            <label class="form-label fw-bold">Vista previa del JSON de salida:</label>
            <pre id="json-preview" class="p-3 rounded shadow-lg"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
