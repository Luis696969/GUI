<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSim Pro - Interfaz de Simulación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container py-5">
    <h1 class="text-center mb-4">BioSim Interface</h1>

    <div class="mb-4">
        <h3>Dispositivos</h3>
        <button class="btn btn-primary mb-2" onclick="addItem('devices')">+ Añadir Dispositivo</button>
        <div id="container-devices"></div>
    </div>

    <div class="mb-4">
        <h3>Químicos</h3>
        <button class="btn btn-primary mb-2" onclick="addItem('chemicals')">+ Añadir Químico</button>
        <div id="container-chemicals"></div>
    </div>

    <div class="mb-4">
        <h3>Células</h3>
        <button class="btn btn-primary mb-2" onclick="addItem('cells')">+ Añadir Célula</button>
        <div id="container-cells"></div>
    </div>

    <div class="mb-4">
        <h3>Reacciones</h3>
        <button class="btn btn-primary mb-2" onclick="addItem('reactions')">+ Añadir Reacción</button>
        <div id="container-reactions"></div>
    </div>

    <button class="btn btn-success" onclick="ejecutarSimulacion()">Generar JSON</button>

    <pre id="json-preview" class="mt-4"></pre>
</div>

<script src="script.js"></script>
</body>
</html>
