<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSim Pro - Interfaz de Simulación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

    <div class="container py-5">
        <header class="text-center mb-5">
            <h1 class="display-4 fw-bold text-dark">BioSim <span class="text-primary">Interface</span></h1>
            <p class="text-muted">Configuración de parámetros para simulación de difusión celular.</p>
        </header>

        <div class="row g-4">
            <div class="col-md-12">
                <div class="card p-4 shadow-sm h-100">
                    <h5 class="mb-3">Simulación</h5>
                    <div class="row g-3">
                        <div class="col-6">
                            <label>T (Segundos)</label>
                            <input type="number" id="sim_T" class="form-control" value="7200">
                        </div>
                        <div class="col-6">
                            <label>dt</label>
                            <input type="number" id="sim_dt" class="form-control" value="0.01" step="0.001">
                        </div>
                        <div class="col-12 text-muted small mt-3">
                            Los tiempos de ploteo se calculan automáticamente.
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- DISPOSITIVOS -->
        <div class="mt-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Dispositivos</h3>
                <button class="btn btn-primary" onclick="addItem('devices')">+ Añadir Dispositivo</button>
            </div>
            <div id="container-devices" class="dynamic-container"></div>
        </div>

        <!-- CONEXIONES -->
        <div class="mt-5">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h3>Conexiones entre dispositivos</h3>
                <button class="btn btn-primary" onclick="addItem('links')">+ Añadir Conexión</button>
            </div>
            <div id="container-links" class="dynamic-container"></div>
        </div>

        <div class="d-grid mt-5">
            <button class="btn btn-success btn-lg shadow" onclick="ejecutarSimulacion()">🚀 Generar JSON e Iniciar Simulación</button>
        </div>

        <div class="mt-5">
            <label class="form-label fw-bold">Vista previa del JSON de salida:</label>
            <pre id="json-preview" class="p-3 bg-dark text-info rounded shadow-lg"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
